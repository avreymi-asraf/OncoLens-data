<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OncoLens Streaming Architecture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#f0c14b;--accent-dim:rgba(240,193,75,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
header h1{font-size:1.1rem;font-weight:600;letter-spacing:-.02em}
header p{font-size:.78rem;color:var(--muted);max-width:140ch;margin-top:3px;line-height:1.4}
.main{display:flex;flex:1;min-height:0}
#network{flex:1;background:var(--bg);min-width:0}
.sidebar{width:370px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sec{padding:14px 16px;border-bottom:1px solid var(--border)}
.sec h2,.steps h2{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:9px}
.flow-list{list-style:none;max-height:260px;overflow-y:auto}
.flow-item{padding:8px 11px;border-radius:8px;cursor:pointer;font-size:.85rem;margin-bottom:3px;border:1px solid transparent}
.flow-item:hover{background:rgba(255,255,255,.04)}
.flow-item.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.flow-desc{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.clear-btn{margin-top:6px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
.clear-btn:hover{border-color:var(--muted);color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;font-size:.73rem;color:var(--muted)}
.legend span.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.steps{flex:1;overflow-y:auto;padding:14px 16px}
.step{display:flex;gap:11px;margin-bottom:13px;font-size:.84rem;cursor:pointer}
.step-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#0d1117;font-weight:700;font-size:.74rem;display:flex;align-items:center;justify-content:center}
.step strong{display:block;margin-bottom:2px}
.details{color:var(--muted);font-size:.78rem;line-height:1.4}
.empty{color:var(--muted);font-size:.84rem;font-style:italic}
.tip{max-width:340px;font-size:12px;line-height:1.45;color:#e6edf3;background:#1c2128;border:1px solid #444c56;border-radius:8px;padding:9px 11px}
.tip b{font-size:13px}.tip .m{color:#8b949e}.tip code{color:#79c0ff;font-size:11px}
@media(max-width:900px){.main{flex-direction:column}.sidebar{width:100%;height:45vh;border-left:0;border-top:1px solid var(--border)}}
</style>
</head>
<body>

  <div class="steps"><h2>Steps</h2><div id="sc"><p class="empty">Select a flow to highlight its path through the system.</p></div></div>
 </aside>
</div>

const DATA = {"meta": {"title": "OncoLens Streaming Architecture (oncolens.mmai)", "description": "How the oncolens Python package streams the DFCI MatchMiner-AI synthetic oncology corpus from Hugging Face one patient at a time: HTTP range reads of parquet columns (nothing stored on disk), forward-only grouping by pseudo_mrn, optional side tables for trial labels and dates, derived y labels, quality flags, and a leakage-free model_input. Scope: oncolens/ and its tests only.", "generated_at": "2026-11-14T21:30:51+02:00", "repo_root": "oncolens/"}, "nodes": [{"id": "cli", "label": "CLI: python -m oncolens.mmai", "type": "client", "group": "Entry Points", "description": "main() (L446-488): argparse flags --split/--limit/--sample/--dates/--summary/--no-y/--model-input/--revision/-o. Rejects bad args via parser.error before any download, writes one JSON object per line (JSONL) to stdout or a file, closes the generator in finally (releases the HTTP handle), tolerates BrokenPipe when piped into head.", "files": ["oncolens/mmai.py:446-488"], "tech": ["argparse", "json"]}, {"id": "py-caller", "label": "Python caller / notebook", "type": "client", "group": "Entry Points", "description": "Code that does `for patient in mmai.iter_patients(...)` and hands mmai.model_input(patient) to a model while keeping patient['y'] as the answer key (usage shown in the module docstring, L43-48).", "files": ["oncolens/mmai.py:43-48"], "tech": []}, {"id": "tests", "label": "tests/test_mmai.py", "type": "other", "group": "Entry Points", "description": "Network-free pytest suite (fake rows, monkeypatched iter_rows) covering grouping, stage parsing, build_patient shape, model_input leakage, flags, CLI JSONL, argument validation; one @network test streams the first patients from the Hub (run with -m network).", "files": ["tests/test_mmai.py"], "tech": ["pytest"]}, {"id": "iter-patients", "label": "iter_patients()", "type": "api", "group": "Public API (oncolens.mmai)", "description": "Public entry point (L384-413). Checks arguments eagerly (so errors surface before any download), rejects with_summary without with_y, then returns the _iter_patients generator. Args: split, limit, sample, with_y, with_dates, with_summary, revision (pinned commit), batch_size.", "files": ["oncolens/mmai.py:384-413"], "tech": []}, {"id": "check-selection", "label": "_check_selection()", "type": "function", "group": "Public API (oncolens.mmai)", "description": "Validates split in (train,val,test), limit >= 0 and sample in (0,1]. Called by iter_patients and again by patients_from_rows.", "files": ["oncolens/mmai.py:337-343"], "tech": []}, {"id": "iter-patients-impl", "label": "_iter_patients() orchestrator", "type": "function", "group": "Public API (oncolens.mmai)", "description": "Generator (L416-443) that wires the stream together: picks the note columns (adds masked_text + note_is_from_positive_prompt when with_y), loads the small trial-label table if with_y, loads document dates if with_dates, opens the notes row stream, and `yield from` patients_from_rows. Returns immediately when limit == 0.", "files": ["oncolens/mmai.py:416-443"], "tech": []}, {"id": "model-input", "label": "model_input()", "type": "function", "group": "Public API (oncolens.mmai)", "description": "Builds the object to hand a model (L323-334): opaque patient_id plus documents reduced to seq/type/date/text, dropping flagged documents (refusals/placeholders) unless include_flagged. No split, source, MRN or y. seq keeps original positions so a gap shows a dropped note.", "files": ["oncolens/mmai.py:323-334"], "tech": []}, {"id": "iter-rows", "label": "iter_rows()", "type": "function", "group": "Hub Transport", "description": "Streams one parquet file as dict rows (L90-105): opens datasets/<repo>@<revision>/<file> through HfFileSystem (32 MB blocks, cache_type='none'), pq.ParquetFile(buffer_size=32 MB, pre_buffer=False), iter_batches(batch_size, columns=...) and yields batch.to_pylist(). Only requested columns are fetched, so memory stays bounded (~0.5 GB RSS) even for a single huge row group.", "files": ["oncolens/mmai.py:90-105"], "tech": ["pyarrow", "huggingface_hub"]}, {"id": "load-trial-labels", "label": "load_trial_labels()", "type": "function", "group": "Hub Transport", "description": "Reads the small eligibility table (pseudo_mrn, nct_id, title, this_space, eligibility_result; + patient_summary when with_summary, ~80 MB) into a dict keyed by pseudo_mrn. ~5-15 s without the summary.", "files": ["oncolens/mmai.py:108-116"], "tech": []}, {"id": "load-dates", "label": "load_document_dates()", "type": "function", "group": "Hub Transport", "description": "Streams ~1 GB of patient_long_text from the summaries file (~3-4 min) and keeps only the '<date> <doc_type>' headers per patient via parse_document_dates (regex over DOC_TYPES). Dates exist nowhere else in the dataset.", "files": ["oncolens/mmai.py:119-135"], "tech": []}, {"id": "hf-fs", "label": "HfFileSystem + pyarrow", "type": "infra", "group": "Hub Transport", "description": "fsspec file object over the Hub. pyarrow reads the parquet footer, then fetches only the needed column chunks with HTTP range requests; nothing is written to disk. The notes file has a single 7 GB row group and no page index, so reading is forward-only (no random access).", "files": ["oncolens/mmai.py:98-105"], "tech": ["fsspec", "HTTP range reads"]}, {"id": "hf-notes", "label": "all_synthetic_notes.parquet", "type": "storage", "group": "Remote Data (Hugging Face)", "description": "846,577 synthetic notes for 63,865 patients (columns used: pseudo_mrn, event_type, synthetic_note, split, event_text, masked_text, note_is_from_positive_prompt). Sorted by pseudo_mrn, so each patient's notes are contiguous. 7 GB single row group.", "files": ["oncolens/mmai.py:70,73-74"], "tech": ["parquet"]}, {"id": "hf-elig", "label": "space_specific_eligibility_checks.parquet", "type": "storage", "group": "Remote Data (Hugging Face)", "description": "Small per-patient table: clinical-trial space, NCT id, title, LLM eligibility judgement, optional patient_summary.", "files": ["oncolens/mmai.py:72"], "tech": ["parquet"]}, {"id": "hf-summ", "label": "patient_summaries_and_their_spaces.parquet", "type": "storage", "group": "Remote Data (Hugging Face)", "description": "Holds patient_long_text: the dated, chunk-filtered concatenation of a patient's notes; the only source of synthetic YYYY-MM-DD dates.", "files": ["oncolens/mmai.py:71"], "tech": ["parquet"]}, {"id": "patients-from-rows", "label": "patients_from_rows()", "type": "function", "group": "Stream Core (pure, no network)", "description": "Network-free core (L346-376): validates selection, groups the row stream by pseudo_mrn, skips patients outside the requested split or hash-sample, calls build_patient with that patient's trial label and dates, counts emitted patients and stops at limit.", "files": ["oncolens/mmai.py:346-376"], "tech": []}, {"id": "group-consecutive", "label": "group_consecutive()", "type": "function", "group": "Stream Core (pure, no network)", "description": "itertools.groupby wrapper that yields (key, list) per patient and raises ValueError if a key returns after its group ended, i.e. the input was not sorted. This is what turns an ordered row stream into per-patient groups with only one patient held in memory.", "files": ["oncolens/mmai.py:143-150"], "tech": []}, {"id": "sampling", "label": "Sampling & opaque IDs", "type": "function", "group": "Stream Core (pure, no network)", "description": "sample_bucket(mrn): deterministic [0,1) from sha256(repo:mrn) so sample=0.01 gives the same spread-out subset every time. opaque_patient_id(mrn): 'mmai-' + 12 hex chars, because raw pseudo_mrn < 1e6 is exactly the designed-eligible group and would leak the design label.", "files": ["oncolens/mmai.py:153-164"], "tech": ["hashlib"]}, {"id": "build-patient", "label": "build_patient()", "type": "function", "group": "Stream Core (pure, no network)", "description": "Assembles one patient object (L258-320) from that patient's note rows: checks one split, attaches dates only when the (date,type) headers line up 1:1 with note types (else None, ~4.5% of patients), builds documents[{seq,type,date,text,flag}], and when with_y builds y (event_history, diagnoses, document_events, trial, patient_summary).", "files": ["oncolens/mmai.py:258-320"], "tech": []}, {"id": "strip-markers", "label": "strip_event_markers()", "type": "function", "group": "Labels & Quality", "description": "Turns masked_text (timeline with one event wrapped in <BEGIN/END EVENT ...> markers) into the plain timeline used as y.event_history.", "files": ["oncolens/mmai.py:167-185"], "tech": ["re"]}, {"id": "diagnoses", "label": "parse_diagnoses() + parse_stage()", "type": "function", "group": "Labels & Quality", "description": "Finds timeline lines that state a cancer diagnosis (is_diagnosis_line: 'diagnos*' word with stage/ICD-O/TNM evidence, or ICD-O site+morphology) and regex-parses overall stage (Arabic -> Roman, sub-stage, refinement 'III (IIIb)') plus age_of(). A convenience parse, not a gold label.", "files": ["oncolens/mmai.py:170-237"], "tech": ["re"]}, {"id": "document-flag", "label": "document_flag()", "type": "function", "group": "Labels & Quality", "description": "Marks a generated note unusable: 'refusal' (empty or 'I'm sorry...' under 600 chars) or 'placeholder_event' (note generated from a bracketed or chatter event). Whole corpus at the pinned revision: 1 refusal, 2 placeholders. Flag is stored on the document; model_input drops flagged ones.", "files": ["oncolens/mmai.py:179-180,240-255"], "tech": ["re"]}, {"id": "slm-consumer", "label": "SLM / experiments (OncoLens-lab)", "type": "external", "group": "Consumers", "description": "Downstream consumer of the JSON: prompts built from model_input; y.diagnoses / document_events used as answer sources for RECIST/stage extraction experiments. Lives in the sibling OncoLens-lab repo (not part of oncolens/).", "files": ["wiki-llm/datasets/mmai-synthetic.md"], "tech": []}], "edges": [{"source": "cli", "target": "iter-patients", "label": "calls", "description": "main() builds the stream from parsed flags"}, {"source": "cli", "target": "model-input", "label": "calls", "description": "with --model-input writes model_input(patient) instead of the full object"}, {"source": "cli", "target": "slm-consumer", "label": "feeds", "description": "JSONL file/stdout consumed by experiments"}, {"source": "py-caller", "target": "iter-patients", "label": "calls", "description": "iterates the generator"}, {"source": "py-caller", "target": "model-input", "label": "calls", "description": "prompt JSON without answers"}, {"source": "model-input", "target": "slm-consumer", "label": "feeds", "description": "clean prompt JSON, no y"}, {"source": "tests", "target": "patients-from-rows", "label": "tests", "description": "fake row streams"}, {"source": "tests", "target": "build-patient", "label": "tests", "description": "shape, dates, y"}, {"source": "tests", "target": "iter-patients", "label": "tests", "description": "argument validation before any download; one network smoke test"}, {"source": "tests", "target": "cli", "label": "tests", "description": "main() writes JSONL"}, {"source": "iter-patients", "target": "check-selection", "label": "calls", "description": "eager argument check"}, {"source": "iter-patients", "target": "iter-patients-impl", "label": "returns", "description": "hands back the generator"}, {"source": "iter-patients-impl", "target": "load-trial-labels", "label": "calls", "description": "only when with_y"}, {"source": "iter-patients-impl", "target": "load-dates", "label": "calls", "description": "only when with_dates"}, {"source": "iter-patients-impl", "target": "iter-rows", "label": "calls", "description": "opens the notes row stream"}, {"source": "iter-patients-impl", "target": "patients-from-rows", "label": "yield from", "description": "passes rows + side tables"}, {"source": "load-trial-labels", "target": "iter-rows", "label": "calls", "description": "reads the eligibility file"}, {"source": "load-dates", "target": "iter-rows", "label": "calls", "description": "reads patient_long_text"}, {"source": "iter-rows", "target": "hf-fs", "label": "opens", "description": "HfFileSystem.open + ParquetFile"}, {"source": "hf-fs", "target": "hf-notes", "label": "range-reads", "description": "needed columns only"}, {"source": "hf-fs", "target": "hf-elig", "label": "range-reads", "description": "needed columns only"}, {"source": "hf-fs", "target": "hf-summ", "label": "range-reads", "description": "pseudo_mrn + patient_long_text"}, {"source": "patients-from-rows", "target": "check-selection", "label": "calls", "description": "re-validates when called directly"}, {"source": "patients-from-rows", "target": "group-consecutive", "label": "calls", "description": "one group per pseudo_mrn"}, {"source": "patients-from-rows", "target": "sampling", "label": "calls", "description": "sample_bucket filter"}, {"source": "patients-from-rows", "target": "build-patient", "label": "calls", "description": "per kept patient"}, {"source": "build-patient", "target": "sampling", "label": "calls", "description": "opaque_patient_id"}, {"source": "build-patient", "target": "strip-markers", "label": "calls", "description": "y.event_history"}, {"source": "build-patient", "target": "diagnoses", "label": "calls", "description": "y.diagnoses"}, {"source": "build-patient", "target": "document-flag", "label": "calls", "description": "flag per document"}], "flows": [{"id": "start-stream", "name": "1. Start a stream (validate first)", "description": "From the call to a ready generator; bad arguments fail before any network traffic.", "steps": [{"order": 1, "node": "py-caller", "action": "Call", "details": "iter_patients(split='test', sample=0.01, limit=20, with_dates=True)"}, {"order": 2, "node": "iter-patients", "action": "Eager checks", "details": "Also rejects with_summary without with_y."}, {"order": 3, "node": "check-selection", "action": "Validate", "details": "split in train/val/test, limit >= 0, 0 < sample <= 1; ValueError otherwise."}, {"order": 4, "node": "iter-patients-impl", "action": "Generator created", "details": "Nothing is downloaded until the first next(): the work starts lazily."}]}, {"id": "trial-labels", "name": "2. Load trial labels (small side table)", "description": "If with_y: one quick pass over the eligibility file builds pseudo_mrn -> trial label.", "steps": [{"order": 1, "node": "iter-patients-impl", "action": "Needs labels", "details": "with_y=True so trial info goes into y.trial."}, {"order": 2, "node": "load-trial-labels", "action": "Read columns", "details": "pseudo_mrn, nct_id, title, this_space, eligibility_result (+patient_summary)."}, {"order": 3, "node": "iter-rows", "action": "Stream batches", "details": "512-row pyarrow batches, requested columns only."}, {"order": 4, "node": "hf-fs", "action": "Range reads", "details": "Footer first, then column chunks over HTTP."}, {"order": 5, "node": "hf-elig", "action": "Source", "details": "Few MB (~80 MB with the summary); ~5-15 s."}]}, {"id": "stream-notes", "name": "3. Stream notes into patients (core path)", "description": "The main pipeline: forward-only read of the 7 GB notes file, grouped into one patient at a time.", "steps": [{"order": 1, "node": "iter-patients-impl", "action": "Open note stream", "details": "Columns: pseudo_mrn, event_type, synthetic_note, split, event_text (+masked_text, positive flag for y)."}, {"order": 2, "node": "iter-rows", "action": "Batches to rows", "details": "iter_batches -> to_pylist -> yield rows one by one."}, {"order": 3, "node": "hf-fs", "action": "Range reads", "details": "32 MB blocks, no cache, no pre-buffer; no disk writes."}, {"order": 4, "node": "hf-notes", "action": "Rows arrive sorted", "details": "Sorted by pseudo_mrn: each patient's notes contiguous; first patient after ~10-20 s, ~1,000 notes/s."}, {"order": 5, "node": "patients-from-rows", "action": "Consume rows", "details": "Applies split/sample/limit filters while iterating."}, {"order": 6, "node": "group-consecutive", "action": "Group by pseudo_mrn", "details": "Only the current patient's notes are held; raises if input is not grouped."}, {"order": 7, "node": "sampling", "action": "Hash decisions", "details": "sample_bucket decides inclusion; opaque_patient_id names the patient."}, {"order": 8, "node": "build-patient", "action": "Assemble & yield", "details": "documents + y; caller receives one JSON-serialisable dict per patient."}, {"order": 9, "node": "py-caller", "action": "Receives patient", "details": "Memory stays ~0.5 GB regardless of how many patients are consumed."}]}, {"id": "attach-dates", "name": "4. Attach document dates (optional, ~3-4 min)", "description": "with_dates streams patient_long_text first and keeps only the date/type headers.", "steps": [{"order": 1, "node": "iter-patients-impl", "action": "with_dates=True", "details": "Dates are loaded before the first patient is emitted."}, {"order": 2, "node": "load-dates", "action": "Parse headers", "details": "parse_document_dates regex on '<YYYY-MM-DD> <doc_type>' lines."}, {"order": 3, "node": "iter-rows", "action": "Stream", "details": "batch_size=256 for the large text column."}, {"order": 4, "node": "hf-fs", "action": "Range reads", "details": "~1 GB of patient_long_text."}, {"order": 5, "node": "hf-summ", "action": "Source of dates", "details": "Only place dates exist."}, {"order": 6, "node": "patients-from-rows", "action": "Pass dates by mrn", "details": "document_dates.get(mrn) for each patient."}, {"order": 7, "node": "build-patient", "action": "Align or null", "details": "Dates attached only if (date,type) headers match note types 1:1; else every date is None (~4.5%)."}]}, {"id": "derive-y", "name": "5. Derive y (answers) from the timeline", "description": "y is parsed from generator-side columns, never from the note text the model sees.", "steps": [{"order": 1, "node": "build-patient", "action": "with_y=True", "details": "Takes masked_text of the first note, trial label and positive-prompt flags."}, {"order": 2, "node": "strip-markers", "action": "Plain timeline", "details": "Removes <BEGIN/END EVENT> markers -> y.event_history."}, {"order": 3, "node": "diagnoses", "action": "Diagnoses + stage", "details": "Diagnosis lines with parsed overall stage (Roman, sub-stage) -> y.diagnoses; document_events keeps each note's source event."}]}, {"id": "quality-flags", "name": "6. Flag unusable notes", "description": "Refusals and placeholder-event notes are marked per document at assembly time.", "steps": [{"order": 1, "node": "build-patient", "action": "Per document", "details": "Calls document_flag(synthetic_note, event_text)."}, {"order": 2, "node": "document-flag", "action": "Classify", "details": "refusal / placeholder_event / None. Corpus-wide: 1 refusal, 2 placeholders."}, {"order": 3, "node": "model-input", "action": "Drop flagged", "details": "model_input omits flagged docs unless include_flagged; seq gaps remain visible."}]}, {"id": "model-input-path", "name": "7. Build the model prompt (no leakage)", "description": "What a model sees vs. what stays in y.", "steps": [{"order": 1, "node": "py-caller", "action": "Has patient", "details": "Full patient dict incl. y, split, source."}, {"order": 2, "node": "model-input", "action": "Reduce", "details": "patient_id + documents[seq,type,date,text]; no MRN, split, source, y."}, {"order": 3, "node": "slm-consumer", "action": "Model call", "details": "Prompt JSON for the extraction model; y used only for scoring."}]}, {"id": "cli-export", "name": "8. CLI export to JSONL", "description": "python -m oncolens.mmai ... -o file.jsonl", "steps": [{"order": 1, "node": "cli", "action": "Parse flags", "details": "parser.error on bad combos (--summary with --no-y, limit <= 0)."}, {"order": 2, "node": "iter-patients", "action": "Create stream", "details": "Same API as Python callers; ValueError becomes a CLI error."}, {"order": 3, "node": "iter-patients-impl", "action": "Run stream", "details": "Lazily reads from the Hub."}, {"order": 4, "node": "patients-from-rows", "action": "Filter + group", "details": "split / sample / limit."}, {"order": 5, "node": "build-patient", "action": "Patient object", "details": "With y unless --no-y / --model-input."}, {"order": 6, "node": "model-input", "action": "Optional reduce", "details": "--model-input writes only the prompt-safe object."}, {"order": 7, "node": "slm-consumer", "action": "JSONL out", "details": "One JSON object per line; closed in finally, BrokenPipe tolerated."}]}, {"id": "subset-selection", "name": "9. Choose a subset (split / sample / limit)", "description": "Splits and samples are filters on a forward scan, not random access.", "steps": [{"order": 1, "node": "iter-patients", "action": "Args", "details": "split, sample, limit."}, {"order": 2, "node": "check-selection", "action": "Validate", "details": "Range checks."}, {"order": 3, "node": "patients-from-rows", "action": "Filter loop", "details": "Skips patients of other splits; stops after limit."}, {"order": 4, "node": "group-consecutive", "action": "Patient boundary", "details": "Filtering happens per patient group."}, {"order": 5, "node": "sampling", "action": "Hash bucket", "details": "sample=0.01 keeps ~1% spread over the file; limit alone gives a narrow all-eligible slice (file is grouped by trial space/design)."}]}]};

const LANE_COLOR = {"Entry Points": "#d29922", "Public API (oncolens.mmai)": "#bc8cff", "Hub Transport": "#58a6ff", "Remote Data (Hugging Face)": "#8b949e", "Stream Core (pure, no network)": "#3fb950", "Labels & Quality": "#f0883e", "Consumers": "#f778ba"};

let y=0;
LANES.forEach(l=>{
  const ns=DATA.nodes.filter(n=>n.group===l); const rows=Math.ceil(ns.length/COLS);
  ns.forEach((n,i)=>{const r=Math.floor(i/COLS),c=i%COLS,inRow=Math.min(COLS,ns.length-r*COLS);pos[n.id]={x:(c-(inRow-1)/2)*DX,y:y+PAD+r*DY};});
  const h=PAD+rows*DY-10; laneBox.push({l,y0:y,h}); y+=h+LANE_GAP;
});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tip(n){const d=document.createElement("div");d.className="tip";
  d.innerHTML=`<b>${esc(n.label)}</b><br><span class="m">${esc(n.type)} · ${esc(n.group)}${n.tech.length?" · "+esc(n.tech.join(", ")):""}</span><br>${esc(n.description)}${n.files.length?"<br><br>"+n.files.slice(0,4).map(f=>`<code>${esc(f)}</code>`).join("<br>"):""}`;return d}
const base=n=>({background:LANE_COLOR[n.group]||"#8b949e",border:"#ffffff33"});
const visNodes=new vis.DataSet(DATA.nodes.map(n=>({id:n.id,label:n.label.replace(/ \((\d+)\)/," ($1)"),title:tip(n),x:pos[n.id].x,y:pos[n.id].y,fixed:true,shape:SHAPE[n.type]||"box",
  color:{background:base(n).background,border:base(n).border,highlight:{background:base(n).background,border:"#f0c14b"},hover:{background:base(n).background,border:"#f0c14b"}},
  font:{color:"#0d1117",size:13,face:"system-ui",multi:false},margin:9,borderWidth:1,shapeProperties:{borderDashes:n.type==="external"?[5,4]:false},widthConstraint:{maximum:180}})));
const EC="#4a525c";
const visEdges=new vis.DataSet(DATA.edges.map((e,i)=>({id:"e"+i,from:e.source,to:e.target,label:"",title:`${e.label}: ${e.description}`,arrows:"to",color:{color:EC,highlight:"#f0c14b",hover:"#8b949e",opacity:.4},width:1,smooth:{type:"cubicBezier",roundness:.35}})));
const net=new vis.Network(document.getElementById("network"),{nodes:visNodes,edges:visEdges},{physics:false,interaction:{hover:true,tooltipDelay:100,zoomView:true},edges:{selectionWidth:2},nodes:{shape:"box"}});
net.on("beforeDrawing",ctx=>{
  const xs=Object.values(pos).map(p=>p.x),x0=Math.min(...xs)-DX/2-20,x1=Math.max(...xs)+DX/2+20;
  laneBox.forEach(b=>{ctx.fillStyle=(LANE_COLOR[b.l]||"#888")+"12";ctx.strokeStyle=(LANE_COLOR[b.l]||"#888")+"44";ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(x0,b.y0,x1-x0,b.h,12);ctx.fill();ctx.stroke();
    ctx.fillStyle=(LANE_COLOR[b.l]||"#888");ctx.font="600 13px system-ui";ctx.textAlign="left";ctx.fillText(b.l.toUpperCase(),x0+14,b.y0+24);});
});
document.getElementById("t").textContent=DATA.meta.title;
document.getElementById("d").textContent=DATA.meta.description+"  ·  Generated "+DATA.meta.generated_at.slice(0,10)+" from "+DATA.meta.repo_root;
const lg=document.getElementById("lg");
LANES.forEach(l=>{const s=document.createElement("div");s.innerHTML=`<span class="dot" style="background:${LANE_COLOR[l]}"></span>${esc(l)}`;lg.appendChild(s)});
const fl=document.getElementById("fl");
DATA.flows.forEach(f=>{const li=document.createElement("li");li.className="flow-item";li.dataset.id=f.id;li.innerHTML=`${esc(f.name)}<span class="flow-desc">${esc(f.description)}</span>`;li.onclick=()=>select(f.id);fl.appendChild(li)});
document.getElementById("clr").onclick=()=>select(null);
let overlay=[];
function reset(){
  visNodes.update(DATA.nodes.map(n=>({id:n.id,label:n.label,opacity:1,borderWidth:1,color:{background:base(n).background,border:base(n).border,highlight:{background:base(n).background,border:"#f0c14b"},hover:{background:base(n).background,border:"#f0c14b"}}})));
  visEdges.update(visEdges.getIds().map(id=>({id,width:1,color:{color:EC,opacity:.4,highlight:"#f0c14b"},dashes:false})));
  if(overlay.length){visEdges.remove(overlay);overlay=[]}
}
function select(id){
  document.querySelectorAll(".flow-item").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  reset(); const sc=document.getElementById("sc");
  if(!id){sc.innerHTML='<p class="empty">Select a flow to highlight its path through the system.</p>';net.fit({animation:true});return}
  const f=DATA.flows.find(x=>x.id===id),steps=[...f.steps].sort((a,b)=>a.order-b.order),on=new Set(steps.map(s=>s.node));
  const hit=new Set(),add=[];
  for(let i=0;i<steps.length-1;i++){const a=steps[i].node,b=steps[i+1].node;if(a===b)continue;
    let e=visEdges.get().find(x=>x.from===a&&x.to===b&&!String(x.id).startsWith("o"))||visEdges.get().find(x=>x.from===b&&x.to===a&&!String(x.id).startsWith("o"));
    if(e)hit.add(e.id);else add.push({id:"o"+i,from:a,to:b,arrows:"to",dashes:[6,5],width:3,color:{color:"#f0c14b",opacity:1},smooth:{type:"curvedCW",roundness:.2},title:"flow transition (no direct dependency edge)"});}
  overlay=add.map(x=>x.id);visEdges.add(add);
  visEdges.update([...hit].map(id=>({id,width:3.5,color:{color:"#f0c14b",opacity:1,highlight:"#f0c14b"}})));
  visEdges.update(visEdges.getIds().filter(i=>!hit.has(i)&&!overlay.includes(i)).map(i=>({id:i,color:{color:"#30363d",opacity:.2}})));
  const firstStep={};steps.forEach(s=>{(firstStep[s.node]??=[]).push(s.order)});
  visNodes.update(DATA.nodes.map(n=>{const o=on.has(n.id);return{id:n.id,label:o?`${firstStep[n.id].join(",")}. ${n.label}`:n.label,opacity:o?1:.22,borderWidth:o?4:1,color:{background:base(n).background,border:o?"#f0c14b":base(n).border,highlight:{background:base(n).background,border:"#f0c14b"},hover:{background:base(n).background,border:"#f0c14b"}}}}));
  net.fit({nodes:[...on],animation:true});
  sc.innerHTML=steps.map(s=>{const n=byId[s.node];return `<div class="step" data-n="${esc(s.node)}"><div class="step-num">${s.order}</div><div><strong>${esc(n?n.label:s.node)} — ${esc(s.action)}</strong><div class="details">${esc(s.details)}</div></div></div>`}).join("");
  sc.querySelectorAll(".step").forEach(el=>el.onclick=()=>net.focus(el.dataset.n,{scale:1,animation:true}));
}
net.once("afterDrawing",()=>net.fit());
</script>
</body>
</html>
